name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and integration tests
        run: npm test
      - name: Browser tests (Chrome)
        run: node tests/e2e.js --browser "$(which google-chrome)"
      - name: Static build
        run: npm run build
