<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draftwork</title>
  <script>try{var a=JSON.parse(localStorage.getItem('draftwork.appearance')||'{}');if(a.theme&&a.theme!=='system')document.documentElement.dataset.theme=a.theme;if(a.size&&a.size!=='normal')document.documentElement.dataset.size=a.size}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" id="brand">Draftwork</a>
    <span class="spacer"></span>
    <span class="appearance-slot"></span>
  </header>
  <main class="page narrow">
    <h1 class="home-title">Draftwork</h1>
    <div class="choices">
      <a class="card choice" href="student.html">
        <h2>Write</h2>
        <p class="muted">Open an assignment from your instructor.</p>
      </a>
      <a class="card choice" href="instructor.html">
        <h2>Review</h2>
        <p class="muted">Create assignments and read submissions.</p>
      </a>
    </div>
  </main>
  <script type="module">
    import { $, LOGO } from './js/ui/dom.js';
    import { appearanceButton } from './js/ui/appearance.js';
    import { initTooltips } from './js/ui/tooltip.js';
    initTooltips();
    $('#brand').insertAdjacentHTML('afterbegin', LOGO);
    $('.appearance-slot').append(appearanceButton());
  </script>
</body>
</html>
