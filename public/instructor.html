<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Draftwork Viewer</title>
  <script>try{var a=JSON.parse(localStorage.getItem('draftwork.appearance')||'{}');if(a.theme&&a.theme!=='system')document.documentElement.dataset.theme=a.theme;if(a.size&&a.size!=='normal')document.documentElement.dataset.size=a.size}catch(e){}</script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" id="brand">Draftwork</a>
    <nav role="tablist" class="topnav">
      <button role="tab" id="tab-review" aria-selected="true" aria-controls="view-review">Submissions</button>
      <button role="tab" id="tab-assign" aria-selected="false" aria-controls="view-assign">Assignments</button>
    </nav>
    <span class="spacer"></span>
    <span class="appearance-slot"></span>
  </header>

  <main class="page">
    <!-- Submissions -->
    <section id="view-review" role="tabpanel">
      <div id="review-list">
        <h1>Submissions</h1>
        <label class="dropzone" id="drop" for="file-input" data-tip="Files are opened in this browser only; nothing is uploaded. You can drop the zip your LMS gives you for “download all submissions”.">
          <strong>Drop .draftwork files or your LMS’s submissions zip here</strong><br>or click to choose
          <input type="file" id="file-input" accept=".draftwork,.zip,application/zip,application/gzip,application/json" multiple class="hidden">
        </label>
        <div class="row" style="margin-top:10px">
          <button class="btn small hidden" id="load-demo" type="button" data-tip="Open a set of sample submissions to try the viewer">Load demo class</button>
          <button class="btn small hidden" id="export-csv" type="button" data-tip="Download a spreadsheet of every open submission: checks, flags, check-in outcomes and process measures. Names can be left out for sharing calibration data.">Export…</button>
          <button class="btn small ghost hidden" id="clear-files" type="button">Clear</button>
          <span class="small muted" id="load-status" role="status"></span>
        </div>
        <div id="groups" style="margin-top:20px"></div>
      </div>
      <div id="review-detail" class="hidden">
        <div class="row" style="margin-bottom:16px">
          <button class="btn small" id="back" type="button">← All submissions</button>
          <span class="spacer"></span>
          <button class="btn small" id="prev" type="button" data-tip="Previous student (alphabetical)">← Previous</button>
          <button class="btn small" id="next" type="button" data-tip="Next student (alphabetical)">Next →</button>
        </div>
        <div id="report"></div>
      </div>
    </section>

    <!-- Assignments -->
    <section id="view-assign" role="tabpanel" class="hidden">
      <h1>Assignments</h1>
      <div class="grid2">
        <form class="card stack" id="new-form">
          <h2>New assignment</h2>
          <div>
            <label for="f-title">Title</label>
            <input type="text" id="f-title" required placeholder="Essay 2: Cities and Memory">
          </div>
          <div>
            <label for="f-paste" data-tip="Students can always move their own text around. This controls pasting text from anywhere else.">Pasting from other sources</label>
            <select id="f-paste">
              <option value="block">Blocked</option>
              <option value="allow">Allowed</option>
            </select>
          </div>
          <label class="check" data-tip="A side panel where students paste quotes, then copy them into their writing. Quotes are marked as such in the record."><input type="checkbox" id="f-sources" checked> <span>Sources panel for quotes</span></label>
          <div class="row">
            <div style="flex:1"><label for="f-min">Min words</label><input type="number" id="f-min" min="0" placeholder="Optional"></div>
            <div style="flex:1"><label for="f-max">Max words</label><input type="number" id="f-max" min="0" placeholder="Optional"></div>
          </div>
          <div>
            <label for="f-due" data-tip="Shown to students while they write. Work after this time is marked in the viewer, but not blocked.">Due <span class="hint">(optional)</span></label>
            <input type="datetime-local" id="f-due">
          </div>
          <label class="check" data-tip="Students say whether and how they used AI tools (for ideas, feedback, drafting…). Their answer is shown with their work."><input type="checkbox" id="f-ai"> <span>Ask students to disclose AI use</span></label>
          <details>
            <summary>Advanced</summary>
            <div class="stack" style="margin-top:12px">
              <div>
                <label for="f-tsa" data-tip="Where students’ progress is sent to be timestamped. Leave as /tsa unless you run a separate relay.">Timestamp service</label>
                <input type="text" id="f-tsa" value="/tsa">
              </div>
              <label class="check" data-tip="Accept timestamps from Draftwork’s built-in demo service, which proves nothing about time. Only for trying things out, never for real assignments."><input type="checkbox" id="f-demo"> <span>Test assignment (accept demo timestamps)</span></label>
              <div>
                <label for="f-anchors" data-tip="Draftwork already accepts FreeTSA, DigiCert, Sectigo, GlobalSign and SSL.com. Add another service here, one per line, as: name, SHA-256 of its CA public key.">Extra approved timestamp services <span class="hint">(optional)</span></label>
                <textarea id="f-anchors" rows="2" placeholder="My University TSA, 3f2a…(64 hex characters)"></textarea>
              </div>
              <div>
                <div class="label-like" data-tip="When each flag is raised. These are starting values; students’ previews use the same settings.">Flag thresholds</div>
                <div class="thresholds" id="f-thresholds"></div>
              </div>
            </div>
          </details>
          <div><button class="btn primary" type="submit">Create</button></div>
        </form>
        <div class="stack">
          <div class="card stack">
            <h2>Import</h2>
            <div class="row">
              <input type="text" id="import-code" placeholder="Assignment code or student link" aria-label="Assignment code or student link" style="flex:1">
              <button class="btn" id="import-btn" type="button" data-tip="Add an assignment created in another browser, so its submissions can be checked">Import</button>
            </div>
          </div>
          <div class="card" id="assign-list"></div>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="js/instructor.js"></script>
</body>
</html>
